name: Build Android Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version name to stamp into the APK (defaults to tag or 0.0.0-dev)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve release version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
          else
            version="0.0.0-dev"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Building version: ${version}"

      - name: Configure release properties
        run: |
          keystore_path="${RUNNER_TEMP}/nuvio-release.jks"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties

          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          printf '\nNUVIO_RELEASE_STORE_FILE=%s\n' "${keystore_path}" >> local.properties

          required_properties=(
            NUVIO_RELEASE_STORE_PASSWORD
            NUVIO_RELEASE_KEY_ALIAS
            NUVIO_RELEASE_KEY_PASSWORD
          )
          for property_name in "${required_properties[@]}"; do
            if ! grep -Eq "^${property_name}=.+" local.properties; then
              echo "Missing required property: ${property_name}" >&2
              exit 1
            fi
          done

      - name: Build full release APKs
        run: ./gradlew :androidApp:assembleFullRelease -Pnuvio.app.versionName="${{ steps.version.outputs.version }}" --stacktrace

      - name: Stage APKs with versioned names
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist
          for src in androidApp/build/outputs/apk/full/release/*.apk; do
            name=$(basename "$src")
            case "$name" in
              *universal*)   cp "$src" "dist/Nuvio-v${version}.apk" ;;
              *arm64-v8a*)   cp "$src" "dist/Nuvio-v${version}_arm64-v8a.apk" ;;
              *armeabi-v7a*) cp "$src" "dist/Nuvio-v${version}_armeabi-v7a.apk" ;;
              *x86_64*)      cp "$src" "dist/Nuvio-v${version}_x86_64.apk" ;;
              *x86*)         cp "$src" "dist/Nuvio-v${version}_x86.apk" ;;
              *)             cp "$src" "dist/${name}" ;;
            esac
          done
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-${{ steps.version.outputs.version }}-android-full-release
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APKs to the draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nuvio ${{ github.ref_name }}
          draft: true
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
